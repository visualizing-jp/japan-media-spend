<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日本人はどのメディアを信じてきたか — 新聞通信調査会</title>
    <meta name="description" content="新聞通信調査会「メディアに関する全国世論調査」。実査年2008–2025。100点を全面的に信頼、0点を全く信頼していないとした平均点。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <header class="mast">
        <div class="bar-rule">
          <div class="bar">
            <a class="back" data-home id="home" href="/"><span class="back-arrow" aria-hidden="true">←</span><span class="back-name">日本のメディア環境</span><span class="back-extra">シリーズ一覧</span></a>
            <span class="brand"><a class="logo logo-bar" data-mark href="https://visualizing.jp/" aria-label="visualizing.jp"></a><span class="domain" data-domain id="domain"></span></span>
          </div>
        </div>
        <div class="title-row">
          <div class="title-block">
            <h1>日本人はどのメディアを信じてきたか</h1>
          <p class="kicker">新聞通信調査会　2008–2025　実査の年</p>
          </div>
          <nav class="views" id="views" aria-label="ビュー"></nav>
        </div>
      </header>
      <main class="sheet">
        <p class="lede rise rise-3" id="lede"></p>
        <div class="view-panel" data-view="score">
        <section class="chart-block rise rise-4">
          <h2 class="chart-title">総数の信頼度</h2>
          <p class="chart-note">100点を全面的に信頼、50点を普通、0点を全く信頼していない、とした平均点。年は実施日の年。</p>
          <div class="readout" id="readout" aria-live="polite"></div>
          <div id="chart"></div>
          <p class="chart-note">グラフに触れると年が変わる。選んでから、左右の矢印でも移動できる。</p>
        </section>
        </div>
        <section class="notes">
          <h2>読み方</h2>
          <ol id="notes"></ol>
        </section>
        <section class="notes">
          <h2>年次の数値</h2>
          <p class="chart-note">単位は点。空欄は、その回の総数の行にない媒体。0ではない。</p>
          <div class="table-scroll"><table class="years" id="table"></table></div>
        </section>
        <section class="source" id="source"></section>
        <div class="colophon-bar">
          <a class="back" data-home href="/"><span class="back-arrow" aria-hidden="true">←</span><span>シリーズ「日本のメディア環境」の一覧へ</span></a>
          <a class="viz-by" href="https://visualizing.jp/"><span class="logo logo-foot" data-mark></span><span class="viz-by-text"><span class="viz-kicker">Visualized by</span><span class="viz-name">visualizing.jp</span></span></a>
        </div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
