<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>世帯はメディアにいくら払ってきたか — 家計調査</title>
    <meta
      name="description"
      content="二人以上の世帯が新聞・雑誌・書籍と放送の受信料に払ってきた年間の金額。家計調査、1963–2025年。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500&family=Noto+Sans+JP:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="mast">
        <div class="bar-rule">
          <div class="bar">
            <a class="back" data-home id="home" href="/"><span class="back-arrow" aria-hidden="true">←</span><span class="back-name">日本のメディア環境</span><span class="back-extra">シリーズ一覧</span></a>
            <span class="brand"><a class="logo logo-bar" data-mark href="https://visualizing.jp/" aria-label="visualizing.jp"></a><span class="domain" data-domain id="domain"></span></span>
          </div>
        </div>
        <div class="title-row">
          <div class="title-block">
            <h1>世帯はメディアにいくら払ってきたか</h1>
          <p class="kicker">家計調査　1963–2025</p>
          </div>
          <nav class="views" id="views" aria-label="ビュー"></nav>
        </div>
      </header>
      <main class="sheet">
        <p class="lede rise rise-3" id="lede"></p>
        <div class="view-panel" data-view="amount">
        <section class="chart-block rise rise-4">
          <div class="chart-head">
            <div>
              <h2 class="chart-title">年間に払った金額</h2>
              <p class="chart-note" id="amount-note">積み上げは、その年に公表されている品目だけを足している。2000年で帯を切る。</p>
            </div>
            <div class="scale" id="scale" role="radiogroup" aria-label="表示" data-mode="share">
              <span class="scale-thumb" aria-hidden="true"></span>
              <button type="button" role="radio" data-mode="share" aria-checked="true">構成比</button>
              <button type="button" role="radio" data-mode="amount" aria-checked="false">量</button>
            </div>
          </div>
          <div class="readout" id="readout" aria-live="polite"></div>
          <div id="stack" hidden></div>
          <div id="share"></div>
          <p class="chart-note">グラフに触れると年が変わる。選んでから、左右の矢印でも移動できる。</p>
        </section>
        </div>
        <div class="view-panel" data-view="item">
        <section class="chart-block">
          <h2 class="chart-title">品目ごとに見ると</h2>
          <p class="chart-note">同じ金額。線が切れる年は、まだ分かれていないか、世帯の範囲が違う。</p>
          <div id="lines"></div>
        </section>
        </div>
        <section class="notes">
          <h2>定義の切れ目</h2>
          <ol id="notes"></ol>
        </section>
        <section class="notes">
          <h2>年次の数値</h2>
          <p class="chart-note">空欄は、その品目として公表されていない年。0円ではない。</p>
          <div class="table-scroll">
            <table class="years" id="table"></table>
          </div>
        </section>
        <section class="source" id="source"></section>
        <div class="colophon-bar">
          <a class="back" data-home href="/"><span class="back-arrow" aria-hidden="true">←</span><span>シリーズ「日本のメディア環境」の一覧へ</span></a>
          <a class="viz-by" href="https://visualizing.jp/"><span class="logo logo-foot" data-mark></span><span class="viz-by-text"><span class="viz-kicker">Visualized by</span><span class="viz-name">visualizing.jp</span></span></a>
        </div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
